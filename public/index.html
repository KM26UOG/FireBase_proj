<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="scripts/process.js" defer></script>
    <link rel="stylesheet" href="stylesheets/main.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier League Matches</title>
  </head>
  <body>
    <a href="about.html" class="btn btn-outline-primary" style="position: absolute; top: 10px; right: 10px;">About</a>
    <header>
      <h1>Premier League Matches</h1>
    </header>
    <dic class="container">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-sm-5 col-md-4">
          <label class="form-label" for="team-select">Select Team</label>
          <select class="form-select" id="team-select">
            <option id="all-teams" value="">All Teams</option>
          </select>
        </div>
        <div class="col-sm-5 col-md-4">
          <label class="form-label" for="ref-select">Select Referee</label>
          <select class="form-select" id="ref-select">
            <option id="all-referees" value="">All Referees</option>
          </select>
      </div>
      <div class="col-sm-2">
          <button
            class="btn btn-outline-primary"
            type="button"
            id="show-table"
          >
            Show Premier League Table
          </button>
        </div>

      </div>
    </div>
    <div class="container">
      <h2>Matches</h2>
      <div class="row g-3 align-items-end mb-3">
        <div class="col-sm-5 col-md-4">
          <label class="form-label" for="start-date">From Date</label>
          <input class="form-control" type="date" id="start-date" />
        </div>

        <div class="col-sm-5 col-md-4">
          <label class="form-label" for="end-date">To Date</label>
          <input class="form-control" type="date" id="end-date" />
        </div>
        <div class="col-sm-2">
          <button
            class="btn btn-outline-primary"
            type="button"
            id="clear-dates"
          >
            Show all
          </button>
        </div>
      </div>
      <p id="matches-status" aria-live="polite"></p>
      <div id="matches-container" class="row"></div>
    </div>

    <footer>
      <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
    <div class="create_model">#</div>
  </body>
</html>
